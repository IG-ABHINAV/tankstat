query TyreTrash($orderBy: TyreTrashSortField!, $direction: SortDirection!, $skip: Int!, $take: Int!) {
  tyreTrash(orderBy: $orderBy, direction: $direction, skip: $skip, take: $take) {
    kind
    id
    setName
    entryKind
    day
    until
    installationCount
    deletedAt
    version
    withExpense
    label
    corner
    canDelete
    vehicle {
      id
      name
    }
  }
  tyreTrashCount
  tyreTrashDeletableCount
}

