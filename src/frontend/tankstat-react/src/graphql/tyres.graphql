# A vehicle's tyres (#287): sets with their figures, their installations with distances (worked out by the server), the tyre log's lines (#288) and the
# vehicle's readings, from which a day's odometer is worked out on the device (tyres/odometer.ts) for a form's hint and a log line.

fragment TyreSetFields on TyreSet {
  id
  vehicleId
  name
  season
  size
  since
  madeWeek
  madeYear
  roughDistance
  roughUntil
  retiredOn
  isRetired
  brokenUpOn
  version
}

# A single tyre of a set tracked tyre by tyre (#289), and its times on the car.
fragment TyreFields on Tyre {
  id
  setId
  label
  name
  madeWeek
  madeYear
  since
  roughDistance
  retiredOn
  retiredWhy
  replacedById
  isRetired
  version
}

fragment TyrePlaceFields on TyrePlace {
  id
  tyreId
  installationId
  from
  until
  corner
  version
}

fragment TyreInstallationFields on TyreInstallation {
  id
  setId
  from
  until
  pairOneFront
  version
}

fragment TyreEntryFields on TyreEntry {
  id
  kind
  setId
  installationId
  day
  odometer
  note
  version
  expenseId
  amount
  currency
  category
  expenseTrashed
  # A single tyre's line (#289), and the lines made together for several tyres: one row of the log, one expense.
  tyreId
  groupId
}

fragment VehicleTyresFields on VehicleTyres {
  vehicleId
  hasReadings
  expenseCategory
  spentAll {
    currency
    amount
  }
  spentNoSet {
    currency
    amount
  }
  readings {
    date
    value
  }
  entries {
    ...TyreEntryFields
  }
  sets {
    onTheCar
    spent {
      currency
      amount
    }
    repairs
    set {
      ...TyreSetFields
    }
    figures {
      distance
      approximate
      measured
      pairOneFront
      pairOneRear
      pairsUnknown
      suggestion {
        distance
        until
        measuredBefore
      }
    }
    installations {
      installation {
        ...TyreInstallationFields
      }
      distance {
        distance
        approximate
        measure
      }
    }
    tyres {
      onTheCar
      corner
      spent {
        currency
        amount
      }
      repairs
      tyre {
        ...TyreFields
      }
      figures {
        distance
        approximate
        measured
        front
        rear
        unknown
      }
      places {
        place {
          ...TyrePlaceFields
        }
        distance {
          distance
          approximate
          measure
        }
      }
    }
  }
}

query VehicleTyres($vehicleId: UUID!) {
  vehicleTyres(vehicleId: $vehicleId) {
    ...VehicleTyresFields
  }
}

mutation AddTyreSet($input: AddTyreSetInput!) {
  addTyreSet(input: $input) {
    ...VehicleTyresFields
  }
}

