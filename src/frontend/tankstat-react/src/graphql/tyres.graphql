# A vehicle's tyres (#287): sets with their figures, their installations with distances (worked out by the server), the tyre log's lines (#288) and the
# vehicle's readings, from which a day's odometer is worked out on the device (tyres/odometer.ts) for a form's hint and a log line.

fragment TyreSetFields on TyreSet {
  id
  vehicleId
  name
  season
  size
  since
  madeWeek
  madeYear
  roughDistance
  roughUntil
  retiredOn
  isRetired
  version
}

fragment TyreInstallationFields on TyreInstallation {
  id
  setId
  from
  until
  pairOneFront
  version
}

fragment TyreEntryFields on TyreEntry {
  id
  kind
  setId
  installationId
  day
  odometer
  note
  version
}

fragment VehicleTyresFields on VehicleTyres {
  vehicleId
  hasReadings
  readings {
    date
    value
  }
  entries {
    ...TyreEntryFields
  }
  sets {
    onTheCar
    set {
      ...TyreSetFields
    }
    figures {
      distance
      approximate
      measured
      pairOneFront
      pairOneRear
      pairsUnknown
      suggestion {
        distance
        until
        measuredBefore
      }
    }
    installations {
      installation {
        ...TyreInstallationFields
      }
      distance {
        distance
        approximate
        measure
      }
    }
  }
}

query VehicleTyres($vehicleId: UUID!) {
  vehicleTyres(vehicleId: $vehicleId) {
    ...VehicleTyresFields
  }
}

mutation AddTyreSet($input: AddTyreSetInput!) {
  addTyreSet(input: $input) {
    ...VehicleTyresFields
  }
}

mutation UpdateTyreSet($input: UpdateTyreSetInput!) {
  updateTyreSet(input: $input) {
    ...VehicleTyresFields
  }
}

mutation SetTyreRoughDistance($input: SetTyreRoughDistanceInput!) {
  setTyreRoughDistance(input: $input) {
    ...VehicleTyresFields
  }
}

mutation SwapTyres($input: SwapTyresInput!) {
  swapTyres(input: $input) {
    ...VehicleTyresFields
  }
}

mutation ChangeTyrePositions($input: SwapTyresInput!) {
  changeTyrePositions(input: $input) {
    ...VehicleTyresFields
  }
}

mutation AddPastTyreSwaps($input: AddPastTyreSwapsInput!) {
  addPastTyreSwaps(input: $input) {
    ...VehicleTyresFields
  }
}

mutation AddTyreInstallation($input: AddTyreInstallationInput!) {
  addTyreInstallation(input: $input) {
    ...VehicleTyresFields
  }
}

mutation UpdateTyreInstallation($input: UpdateTyreInstallationInput!) {
  updateTyreInstallation(input: $input) {
    ...VehicleTyresFields
  }
}

mutation DeleteTyreInstallation($id: UUID!) {
  deleteTyreInstallation(id: $id) {
    ...VehicleTyresFields
  }
}

mutation RestoreTyreInstallation($id: UUID!) {
  restoreTyreInstallation(id: $id) {
    ...VehicleTyresFields
  }
}

mutation AddTyreEntry($input: AddTyreEntryInput!) {
  addTyreEntry(input: $input) {
    ...VehicleTyresFields
  }
}

mutation UpdateTyreEntry($input: UpdateTyreEntryInput!) {
  updateTyreEntry(input: $input) {
    ...VehicleTyresFields
  }
}

mutation DeleteTyreEntry($id: UUID!) {
  deleteTyreEntry(id: $id) {
    ...VehicleTyresFields
  }
}

mutation RestoreTyreEntry($id: UUID!) {
  restoreTyreEntry(id: $id) {
    ...VehicleTyresFields
  }
}

mutation RetireTyreSet($id: UUID!, $day: LocalDate!) {
  retireTyreSet(id: $id, day: $day) {
    ...VehicleTyresFields
  }
}

mutation UnretireTyreSet($id: UUID!) {
  unretireTyreSet(id: $id) {
    ...VehicleTyresFields
  }
}

mutation DeleteTyreSet($id: UUID!) {
  deleteTyreSet(id: $id) {
    ...VehicleTyresFields
  }
}

mutation RestoreTyreSet($id: UUID!) {
  restoreTyreSet(id: $id) {
    ...VehicleTyresFields
  }
}

query TyreTrash($orderBy: TyreTrashSortField!, $direction: SortDirection!, $skip: Int!, $take: Int!) {
  tyreTrash(orderBy: $orderBy, direction: $direction, skip: $skip, take: $take) {
    kind
    id
    setName
    entryKind
    day
    until
    installationCount
    deletedAt
    version
    canDelete
    vehicle {
      id
      name
    }
  }
  tyreTrashCount
  tyreTrashDeletableCount
}

mutation EmptyTyreTrash {
  emptyTyreTrash
}
